services:
  - type: web
    name: ai-soc-infrastructure
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python demo_app.py
    plan: starter
    autoDeploy: true
    branch: main
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false