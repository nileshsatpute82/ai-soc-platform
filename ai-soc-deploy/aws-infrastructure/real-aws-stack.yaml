AWSTemplateFormatVersion: '2010-09-09'
Description: 'Complete Real AWS Stack for AI Security Operations Platform'

Parameters:
  ProjectName:
    Type: String
    Default: 'ai-soc-platform'
    Description: 'Project name for resource naming'
  
  DBUsername:
    Type: String
    Default: 'aisoc_admin'
    Description: 'Database administrator username'
  
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: 'Database administrator password'

Resources:
  # VPC for secure networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  # Private Subnets for databases
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-subnet-2'

  # DB Subnet Groups
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnet group for RDS'
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-db-subnet-group'

  DocDBSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnet group for DocumentDB'
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-docdb-subnet-group'

  ElastiCacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: 'Subnet group for ElastiCache'
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # Security Groups
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for databases'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: 'PostgreSQL access'
        - IpProtocol: tcp
          FromPort: 27017
          ToPort: 27017
          CidrIp: 0.0.0.0/0
          Description: 'DocumentDB access'
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 0.0.0.0/0
          Description: 'Redis access'

  # RDS PostgreSQL Instance
  PostgreSQLDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-postgres'
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '15.4'
      AllocatedStorage: 20
      StorageType: gp2
      DBName: ai_soc_db
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      MultiAZ: false
      PubliclyAccessible: true
      StorageEncrypted: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-postgres'

  # DocumentDB Cluster
  DocumentDBCluster:
    Type: AWS::DocDB::DBCluster
    Properties:
      DBClusterIdentifier: !Sub '${ProjectName}-docdb-cluster'
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      Engine: docdb
      EngineVersion: '5.0.0'
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      DBSubnetGroupName: !Ref DocDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-docdb-cluster'

  # DocumentDB Instance
  DocumentDBInstance:
    Type: AWS::DocDB::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DocumentDBCluster
      DBInstanceIdentifier: !Sub '${ProjectName}-docdb-instance'
      DBInstanceClass: db.t3.medium
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-docdb-instance'

  # ElastiCache Redis Cluster
  ElastiCacheCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      CacheClusterId: !Sub '${ProjectName}-redis'
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumCacheNodes: 1
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      CacheSubnetGroupName: !Ref ElastiCacheSubnetGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-redis'

  # SQS Queue (from previous setup)
  SecurityAlertsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-security-alerts'
      VisibilityTimeoutSeconds: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20

  # SNS Topic (from previous setup)
  SecurityAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-security-alerts'
      DisplayName: 'AI SOC Security Alerts'

  # SNS to SQS Subscription
  SecurityAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref SecurityAlertsTopic
      Endpoint: !GetAtt SecurityAlertsQueue.Arn

  # SQS Queue Policy
  SecurityAlertsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecurityAlertsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - sns.amazonaws.com
                - events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecurityAlertsQueue.Arn

  # EventBridge Rule for IAM Events
  IAMEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-iam-events'
      Description: 'Detect IAM changes'
      EventPattern:
        source: ['aws.iam']
        detail-type: ['AWS API Call via CloudTrail']
        detail:
          eventName: 
            - 'CreateUser'
            - 'DeleteUser'
            - 'AttachUserPolicy'
            - 'DetachUserPolicy'
            - 'CreateRole'
            - 'DeleteRole'
      State: ENABLED
      Targets:
        - Arn: !GetAtt SecurityAlertsQueue.Arn
          Id: 'IAMEventsTarget'

Outputs:
  PostgreSQLEndpoint:
    Description: 'RDS PostgreSQL endpoint'
    Value: !GetAtt PostgreSQLDB.Endpoint.Address
    Export:
      Name: !Sub '${ProjectName}-postgres-endpoint'
  
  DocumentDBEndpoint:
    Description: 'DocumentDB cluster endpoint'
    Value: !GetAtt DocumentDBCluster.Endpoint
    Export:
      Name: !Sub '${ProjectName}-docdb-endpoint'
  
  ElastiCacheEndpoint:
    Description: 'ElastiCache Redis endpoint'
    Value: !GetAtt ElastiCacheCluster.RedisEndpoint.Address
    Export:
      Name: !Sub '${ProjectName}-redis-endpoint'
  
  SecurityAlertsQueueUrl:
    Description: 'SQS Queue URL for security alerts'
    Value: !Ref SecurityAlertsQueue
    Export:
      Name: !Sub '${ProjectName}-alerts-queue-url'
  
  DatabaseCredentials:
    Description: 'Database connection details'
    Value: !Sub |
      PostgreSQL: ${PostgreSQLDB.Endpoint.Address}:5432/ai_soc_db
      DocumentDB: ${DocumentDBCluster.Endpoint}:27017
      Redis: ${ElastiCacheCluster.RedisEndpoint.Address}:6379
      Username: ${DBUsername}
    Export:
      Name: !Sub '${ProjectName}-db-credentials'