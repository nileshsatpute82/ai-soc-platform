AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Security Operations Platform - AWS Infrastructure'

Parameters:
  ProjectName:
    Type: String
    Default: 'ai-soc-platform'
    Description: 'Project name for resource naming'

Resources:
  # SQS Queue for Security Alerts
  SecurityAlertsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-security-alerts'
      VisibilityTimeoutSeconds: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20

  # SNS Topic for Security Alerts
  SecurityAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-security-alerts'
      DisplayName: 'AI SOC Security Alerts'

  # SNS to SQS Subscription
  SecurityAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref SecurityAlertsTopic
      Endpoint: !GetAtt SecurityAlertsQueue.Arn

  # SQS Queue Policy
  SecurityAlertsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecurityAlertsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecurityAlertsQueue.Arn

  # EventBridge Rule for Failed Logins
  FailedLoginRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-failed-logins'
      Description: 'Detect failed login attempts'
      EventPattern:
        source: ['aws.signin']
        detail-type: ['AWS Console Sign In via CloudTrail']
        detail:
          errorCode: ['SigninFailure']
      State: ENABLED
      Targets:
        - Arn: !Ref SecurityAlertsTopic
          Id: 'FailedLoginTarget'

  # EventBridge Rule for Root Account Usage
  RootAccountRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-root-usage'
      Description: 'Detect root account usage'
      EventPattern:
        source: ['aws.signin']
        detail-type: ['AWS Console Sign In via CloudTrail']
        detail:
          userIdentity:
            type: ['Root']
      State: ENABLED
      Targets:
        - Arn: !Ref SecurityAlertsTopic
          Id: 'RootAccountTarget'

  # EventBridge Rule for IAM Changes
  IAMChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-iam-changes'
      Description: 'Detect IAM changes'
      EventPattern:
        source: ['aws.iam']
        detail-type: ['AWS API Call via CloudTrail']
        detail:
          eventName: 
            - 'CreateUser'
            - 'DeleteUser'
            - 'AttachUserPolicy'
            - 'CreateRole'
            - 'DeleteRole'
      State: ENABLED
      Targets:
        - Arn: !Ref SecurityAlertsTopic
          Id: 'IAMChangesTarget'

Outputs:
  SecurityAlertsQueueUrl:
    Description: 'SQS Queue URL for security alerts'
    Value: !Ref SecurityAlertsQueue
    Export:
      Name: !Sub '${ProjectName}-alerts-queue-url'
  
  SNSTopicArn:
    Description: 'SNS Topic ARN for security alerts'
    Value: !Ref SecurityAlertsTopic
    Export:
      Name: !Sub '${ProjectName}-alerts-topic-arn'